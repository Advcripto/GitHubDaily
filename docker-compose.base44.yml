services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - PYTHONUNBUFFERED=1
      - FLASK_DEBUG=1
    command: ["sh", "-ec", "pip install --no-cache-dir -q -r requirements.txt && exec python server.py"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
